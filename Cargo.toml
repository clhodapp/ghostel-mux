[package]
name = "ghostel-mux"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Terminal sessions for ghostel that outlive the Emacs that shows them"

[[bin]]
name = "ghostel-mux"
path = "src/main.rs"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
bindgen = "0.71"
pkg-config = "0.3"

[profile.release]
lto = true
codegen-units = 1
